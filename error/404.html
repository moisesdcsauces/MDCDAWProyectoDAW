<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Despliegue de Aplicaciones Web</title>
    <!-- Pagina de error 404 del proyecto. El CSS va aqui dentro y no se carga ninguna imagen
         para que la pagina funcione aunque el proyecto se despliegue solo, sin el portfolio -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f7f6f2;
            color: #333333;
            font-family: Arial, sans-serif;
        }

        .cabecera {
            background-color: #0a0a0a;
            color: white;
            text-align: center;
            padding: 22px 16px;
            font-size: 22px;
            font-weight: bold;
        }

        .error {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 16px;
        }

        .error__codigo {
            margin: 0;
            font-size: 120px;
            line-height: 120px;
            color: #777bb4;
        }

        .error__titulo {
            margin: 10px 0 8px 0;
            font-size: 28px;
            font-weight: bold;
            color: #474a8a;
        }

        .error__texto {
            margin: 0 0 30px 0;
            font-size: 17px;
            color: #555555;
        }

        .error__boton {
            display: inline-block;
            padding: 12px 24px;
            background-color: #474a8a;
            color: white;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
        }

        .error__boton:hover {
            background-color: #363970;
        }

        .pie {
            background-color: #0a0a0a;
            color: #cccccc;
            text-align: center;
            padding: 16px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header class="cabecera">Despliegue de Aplicaciones Web</header>

    <main class="error">
        <h1 class="error__codigo">404</h1>
        <p class="error__titulo">Página no encontrada</p>
        <p class="error__texto">La ruta que buscas no existe o se ha movido.</p>
        <!-- Desde el subdominio el inicio del proyecto es la raiz (/). Desde el dominio principal es su carpeta (/MDCDAWProyectoDAW/) -->
        <a class="error__boton" id="volverInicio" href="/">Volver al inicio del proyecto</a>
    </main>

    <footer class="pie">© Moisés Alberto Domínguez Cruz - IES Los Sauces</footer>

    <script>
        // Si la pagina se ve desde la carpeta del proyecto en el dominio principal, el inicio esta en esa carpeta
        if (location.pathname.indexOf('/MDCDAWProyectoDAW/') === 0) {
            document.getElementById('volverInicio').href = '/MDCDAWProyectoDAW/';
        }
    </script>
</body>
</html>
